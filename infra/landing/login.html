<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión · UAGRM</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e2e8f0}
.box{width:min(420px,92vw);background:#111c33;border:1px solid #1e293b;border-radius:16px;padding:32px;text-align:center}
h1{margin:0 0 6px;color:#fff;font-size:1.5rem}p{color:#94a3b8;margin:0 0 24px}
a.btn{display:block;padding:13px;border-radius:10px;text-decoration:none;font-weight:700;margin-bottom:14px}
.main{background:#38bdf8;color:#0f172a}.admin{border:1px solid #475569;color:#e2e8f0}
.back{display:inline-block;margin-top:10px;color:#64748b;font-size:.9rem;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <h1>Iniciar sesión</h1>
  <p>Acceso para el personal de Recursos Humanos</p>
  <a class="btn main" href="/erp/?login=force">Ingresar como personal de RRHH</a>
  <a class="btn admin" href="/auth/admin/master/console/">¿Eres administrador?</a>
  <a class="back" href="/layout/">← Volver al inicio</a>
</div>
</body>
</html>
