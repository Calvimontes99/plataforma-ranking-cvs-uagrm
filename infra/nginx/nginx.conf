user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format gateway '$remote_addr - $request_id [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log gateway;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 30m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","component":"api-gateway"}';
        }

        # OIDC/SSO entry point. The trailing slash preserves Keycloak paths.
        location /auth/ {
            proxy_pass http://keycloak:8080/auth/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 8080;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        location /api/v1/vacancies/ {
            set $vacancies http://ms-vacantes:8080;
            proxy_pass $vacancies;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /graphql {
            set $vacancies http://ms-vacantes:8080;
            proxy_pass $vacancies;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/ingestion/ {
            set $ingestion http://ms-ingesta:3000;
            proxy_pass $ingestion;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/ranking/ {
            set $ranking http://ms-ranking:8000;
            proxy_pass $ranking;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/ai/ {
            set $ai_node http://ai-node:8000;
            proxy_pass $ai_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /agents/ {
            set $ai_node http://ai-node:8000;
            proxy_pass $ai_node$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/read/ {
            set $read_service http://cqrs-read-service:8080;
            rewrite ^/api/v1/read/(.*)$ /$1 break;
            proxy_pass $read_service$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /erp/ {
            set $erp http://mf-erp-react:80;
            rewrite ^/erp/(.*)$ /$1 break;
            proxy_pass $erp$uri$is_args$args;
            proxy_set_header Host $host;
        }

        location /bi/ {
            set $bi http://mf-bi-angular:80;
            rewrite ^/bi/(.*)$ /$1 break;
            proxy_pass $bi$uri$is_args$args;
            proxy_set_header Host $host;
        }

        location /portal/ {
            set $portal http://mf-portal-vue:80;
            rewrite ^/portal/(.*)$ /$1 break;
            proxy_pass $portal$uri$is_args$args;
            proxy_set_header Host $host;
        }

        location /automation/ {
            set $n8n http://n8n:5678;
            proxy_pass $n8n$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /layout {
            return 302 /layout/;
        }

        location /layout/ {
            alias /usr/share/nginx/landing/;
            index index.html;
        }

        location = / {
            return 302 /layout/;
        }
    }
}
