global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: ms-vacantes
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ms-vacantes:8080"]

  - job_name: ms-ingesta
    metrics_path: /metrics
    static_configs:
      - targets: ["ms-ingesta:3000"]

  - job_name: ms-ranking
    metrics_path: /metrics
    static_configs:
      - targets: ["ms-ranking:8000"]

  - job_name: ai-node
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-node:8000"]

  - job_name: cqrs-read-service
    metrics_path: /metrics
    static_configs:
      - targets: ["cqrs-read-service:8080"]
